syntax = "proto3";
package defectfl;

// Defect-FL: Federated Learning for PCB Defect Detection
service DefectService {
  rpc RegisterFactory(FactoryRequest) returns (FactoryResponse);
  rpc UploadDefectImage(ImageUpload) returns (DetectionResult);
  rpc GetGlobalModel(ModelRequest) returns (ModelResponse);
  rpc UploadUpdate(UpdateRequest) returns (UpdateResponse);
  rpc GetRoundStatus(RoundStatusRequest) returns (RoundStatusResponse);
  rpc TriggerAggregation(AggregationRequest) returns (AggregationResponse);
  rpc SearchSimilarDefects(SearchRequest) returns (SearchResponse);
  rpc GetAuditLogs(AuditRequest) returns (AuditResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message FactoryRequest {
  string factory_id = 1;
  string factory_name = 2;
  string location = 3;
  int32 production_line_count = 4;
}

message FactoryResponse {
  bool success = 1;
  string factory_id = 2;
  string message = 3;
}

message ImageUpload {
  string factory_id = 1;
  bytes image_data = 2;
  string image_format = 3;
  string production_line = 4;
}

message DetectionResult {
  repeated Defect defects = 1;
  float defect_rate = 2;
  int32 total_boards = 3;
  int32 defective_boards = 4;
}

message Defect {
  string defect_type = 1;
  float confidence = 2;
  repeated float bbox = 3;
  string severity = 4;
}

message ModelRequest { string factory_id = 1; }
message ModelResponse { bytes model_data = 1; int32 version = 2; }

message UpdateRequest {
  string factory_id = 1;
  bytes gradient_data = 2;
  int32 num_samples = 3;
  float local_loss = 4;
  float local_accuracy = 5;
  repeated int32 class_distribution = 6;
}

message UpdateResponse { bool accepted = 1; string message = 2; }

message RoundStatusRequest { int32 round_id = 1; }
message RoundStatusResponse {
  int32 round_id = 1;
  string status = 2;
  int32 participants = 3;
  float global_loss = 4;
  float global_accuracy = 5;
}

message AggregationRequest { string strategy = 1; }
message AggregationResponse {
  bool success = 1;
  int32 round_id = 2;
  float global_loss = 3;
  float global_accuracy = 4;
  int32 num_participants = 5;
}

message SearchRequest {
  repeated float query_vector = 1;
  int32 top_k = 2;
}

message SearchResponse {
  repeated SimilarDefect results = 1;
}

message SimilarDefect {
  string defect_id = 1;
  string defect_type = 2;
  float similarity = 3;
  string factory_id = 4;
}

message AuditRequest { int32 limit = 1; }
message AuditResponse { repeated AuditEntry entries = 1; }
message AuditEntry {
  int64 timestamp = 1;
  string operation = 2;
  string factory_id = 3;
  string details = 4;
}

message HealthCheckRequest {}
message HealthCheckResponse {
  bool healthy = 1;
  string version = 2;
  int32 active_factories = 3;
}
